<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkGPT</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
:root{--bg:#212121;--sidebar:#171717;--card:#2f2f2f;--border:#3a3a3a;--text:#ececec;--muted:#9b9b9b;--accent:#10a37f}
body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
/* SIDEBAR - Like ChatGPT */
.sidebar{width:260px;background:var(--sidebar);display:flex;flex-direction:column;padding:12px;border-right:1px solid #2a2a2a;transition:.3s}
.sidebar.hidden{margin-left:-260px}
.sidebar-top{display:flex;gap:8px}
.btn{flex:1;background:transparent;border:1px solid #3a3a3a;color:var(--text);padding:10px;border-radius:10px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px}
.btn:hover{background:#2a2a2a}
.btn.primary{background:#fff;color:#000;border-color:#fff;font-weight:600}
.search{margin:14px 0 10px;background:#2a2a2a;border-radius:10px;padding:9px 12px;display:flex;gap:8px}
.search input{background:transparent;border:none;outline:none;color:#fff;width:100%;font-size:13px}
.label{font-size:11px;color:var(--muted);padding:8px 8px 6px;text-transform:uppercase;letter-spacing:.5px}
.chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.chat-item{padding:10px 10px;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item:hover,.chat-item.active{background:#2f2f2f}
.sidebar-bottom{border-top:1px solid #2a2a2a;padding-top:12px;display:flex;flex-direction:column;gap:4px}
.user-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.user-row:hover{background:#2f2f2f}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #2a2a2a}
.topbar-left{display:flex;align-items:center;gap:10px}
.icon-btn{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:6px 8px;border-radius:8px}
.icon-btn:hover{background:#2f2f2f}
.model-pill{background:#2f2f2f;padding:6px 12px;border-radius:20px;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%}
.chat{flex:1;overflow-y:auto;padding:24px 0 140px}
.center{max-width:768px;margin:0 auto;padding:0 20px}
.welcome{text-align:center;margin-top:60px}
.welcome h1{font-size:32px;font-weight:600;margin:12px 0 8px}
.welcome p{color:var(--muted);font-size:15px}
.logo-big{width:56px;height:56px;background:#fff;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:0 auto}
.suggest{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px}
.sug{border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;text-align:left;background:transparent;color:var(--text)}
.sug:hover{background:#2f2f2f}
.sug b{display:block;font-size:14px;margin-bottom:4px}
.sug span{font-size:13px;color:var(--muted)}
.msg{margin-bottom:24px;display:flex;gap:14px}
.msg .av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.msg.user .av{background:#4a4a4a}
.msg.ai .av{background:#fff;color:#000;font-weight:800}
.msg-content{line-height:1.6;font-size:15px;padding-top:4px;white-space:pre-wrap;flex:1}
.msg-content code{background:#3a3a3a;padding:2px 6px;border-radius:6px}
/* INPUT - Like ChatGPT */
.input-wrap{position:absolute;bottom:0;left:260px;right:0;background:linear-gradient(transparent,var(--bg) 30%,var(--bg));padding:20px}
.input-wrap.full{left:0}
.input-box{max-width:768px;margin:0 auto;background:#2f2f2f;border-radius:26px;padding:8px 8px 8px 18px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.input-box textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;resize:none;max-height:120px;font-size:15px;padding:8px 0}
.send{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;border:none;cursor:pointer;font-size:18px;flex-shrink:0}
.send:disabled{opacity:.3}
.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}
@media(max-width:768px){.sidebar{position:fixed;z-index:10;height:100%}.input-wrap{left:0}.suggest{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="btn primary" onclick="newChat()">＋ New chat</button>
      <button class="btn" style="flex:0 0 42px;justify-content:center" onclick="toggleSidebar()">☰</button>
    </div>
    <div class="search"><span>🔍</span><input id="search" placeholder="Search chats" oninput="filterChats()"></div>
    <div class="label">Today</div>
    <div class="chat-list" id="chatList">
      <div class="chat-item active">Welcome to DarkGPT</div>
      <div class="chat-item">What can you do?</div>
      <div class="chat-item">Explain Groq AI</div>
    </div>
    <div class="sidebar-bottom">
      <div class="user-row"><div class="avatar">D</div><div><div style="font-size:14px">DarkGPT User</div><div style="font-size:12px;color:var(--muted)">Free plan</div></div></div>
      <button class="btn" onclick="clearChats()">🗑️ Clear all chats</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" onclick="toggleSidebar()">☰</button>
        <div class="model-pill">DarkGPT <span style="color:var(--muted)">▼</span> <span class="dot"></span></div>
      </div>
      <div style="display:flex;gap:4px">
        <button class="icon-btn" onclick="newChat()" title="New chat">＋</button>
        <button class="icon-btn" title="Share">↗</button>
        <button class="icon-btn" title="Settings">•••</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="center" id="center">
        <div class="welcome" id="welcome">
          <div class="logo-big">D</div>
          <h1>What can I help with?</h1>
          <p>Ask anything — fast, smart, no wahala.</p>
          <div class="suggest">
            <button class="sug" onclick="askThis('Write a business plan for a small shop')"><b>💡 Write</b><span>Write a business plan for a small shop</span></button>
            <button class="sug" onclick="askThis('Explain AI in simple words')"><b>🎓 Learn</b><span>Explain AI in simple words</span></button>
            <button class="sug" onclick="askThis('Give me code for a portfolio website')"><b>💻 Code</b><span>Give me code for a portfolio website</span></button>
            <button class="sug" onclick="askThis('Give me 5 content ideas for TikTok')"><b>✨ Ideas</b><span>Give me 5 content ideas for TikTok</span></button>
          </div>
        </div>
        <div id="messages"></div>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-wrap" id="inputWrap">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="Message DarkGPT..." oninput="autoGrow(this)" onkeydown="handleKey(event)"></textarea>
        <button class="send" id="sendBtn" onclick="sendMsg()">↑</button>
      </div>
      <div class="hint">DarkGPT can make mistakes. Check important info.</div>
    </div>
  </div>
</div>

<script>
let chats = [];
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('hidden');document.getElementById('inputWrap').classList.toggle('full')}
function newChat(){document.getElementById('messages').innerHTML='';document.getElementById('welcome').style.display='block';document.getElementById('input').value='';}
function askThis(t){document.getElementById('input').value=t;sendMsg();}
function autoGrow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
function handleKey(e){if(e.key==='Enter' && !e.shiftKey){e.preventDefault();sendMsg()}}
function filterChats(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.chat-item').forEach(i=>{i.style.display=i.textContent.toLowerCase().includes(q)?'block':'none'})}
function clearChats(){if(confirm('Clear all?')) document.getElementById('chatList').innerHTML='<div class="chat-item">No chats yet</div>'}
async function sendMsg(){
  let input=document.getElementById('input');let text=input.value.trim();if(!text) return;
  document.getElementById('welcome').style.display='none';
  let box=document.getElementById('messages');
  box.innerHTML+=`<div class="msg user"><div class="av">U</div><div class="msg-content">${text}</div></div>`;
  input.value='';input.style.height='auto';
  let loading=document.createElement('div');loading.className='msg ai';loading.innerHTML=`<div class="av">D</div><div class="msg-content">Thinking...</div>`;box.appendChild(loading);
  document.getElementById('chat').scrollTop=99999;
  try{
    let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    let data=await res.json();
    loading.querySelector('.msg-content').textContent=data.reply||data.response||'No reply';
  }catch(e){loading.querySelector('.msg-content').textContent='Error: Check your server / Groq key';}
  document.getElementById('chat').scrollTop=99999;
}
</script>
</body>
</html>
